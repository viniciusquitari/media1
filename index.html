<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de média</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
      
  <header>
     <Div class="logo"> 
       <img src="HM.png">
     </Div>

    <div class="inicio">
    <h1> Calculadora de média </h1>
         <p>Conheça a tua média</p>
    </div>
  </header>

  <div class="formulario">
        
      <form>
        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome"
               placeholder="Digite o seu nome completo" required>
        <br><br>

        <label for="classe">Classe:</label><br>
        <input type="text" id="classe" name="classe"
               placeholder="Ex.: 12.ª classe" required>
        <br><br>

        <label for="turma">Turma:</label><br>
        <input type="text" id="turma" name="turma"
               placeholder="Ex.: Turma A" required>
        <br><br>

        <label for="curso">Curso:</label><br>
        <input type="text" id="curso" name="curso"
               placeholder="Digite o seu curso" required>
        <br><br>

    
    <button type="button" id="enviar" onclick="window.location.href='sistema.html'"> Entrar
</button>
        <button type="reset" id="limpar">Limpar</button>
    </form>

     </div>

     

</body>

<footer> 
 
    <h1> HM Academia de Ciências Microsoft Google Kids

    </h1>
    <p class="fundo">Desenvolvemos e transformamos crianças e jovens tornando-se profissionais do fututo incriveis e mentes criativas</p>
  
  

</footer>
</html>
